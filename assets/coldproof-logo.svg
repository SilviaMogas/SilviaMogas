<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="ColdProof logo">
  <title>ColdProof</title>

  <defs>
    <linearGradient id="cold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1F8AFF"/>
      <stop offset="55%" stop-color="#3FB6FF"/>
      <stop offset="100%" stop-color="#8FE3FF"/>
    </linearGradient>
    <linearGradient id="coldSoft" gradientUnits="userSpaceOnUse" x1="90" y1="132" x2="90" y2="48">
      <stop offset="0%" stop-color="#1F8AFF"/>
      <stop offset="100%" stop-color="#8FE3FF"/>
    </linearGradient>
  </defs>

  <style>
    .fg      { fill: #171717; }
    .fg-mute { fill: #525252; }
    @media (prefers-color-scheme: dark) {
      .fg      { fill: #F5F5F5; }
      .fg-mute { fill: #A3A3A3; }
    }
    .wordmark { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- shield -->
  <path d="M90 30 L140 49 V97 C140 126 117 145 90 154 C63 145 40 126 40 97 V49 Z"
        fill="none" stroke="url(#cold)" stroke-width="6" stroke-linejoin="round"/>

  <!-- snowflake: cold-chain verification -->
  <circle cx="90" cy="90" r="10" fill="url(#coldSoft)"/>
  <g stroke="url(#coldSoft)" stroke-width="4" stroke-linecap="round">
    <line x1="90" y1="76" x2="90" y2="62"/>
    <line x1="102.12" y1="83" x2="114.24" y2="76"/>
    <line x1="102.12" y1="97" x2="114.24" y2="104"/>
    <line x1="90" y1="104" x2="90" y2="118"/>
    <line x1="77.88" y1="97" x2="65.76" y2="104"/>
    <line x1="77.88" y1="83" x2="65.76" y2="76"/>
  </g>

  <!-- wordmark -->
  <text class="wordmark fg" x="186" y="88" font-size="48" font-weight="700" letter-spacing="1">COLD<tspan fill="url(#cold)">PROOF</tspan></text>
  <text class="wordmark fg-mute" x="188" y="118" font-size="15" font-weight="500" letter-spacing="4.5">CHAIN VERIFICATION</text>
  <rect x="188" y="130" width="300" height="2" rx="1" fill="url(#cold)"/>
  <text class="wordmark fg-mute" x="188" y="152" font-size="12" font-weight="400" letter-spacing="1.5">COLD-CHAIN VERIFICATION FOR ON-CHAIN LOGISTICS</text>
</svg>
