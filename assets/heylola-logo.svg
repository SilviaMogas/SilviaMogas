<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 180" width="640" height="180" role="img" aria-label="HeyLola Web3 layer logo">
  <title>HeyLola Web3 Layer</title>

  <defs>
    <linearGradient id="love" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="55%" stop-color="#FF6FA5"/>
      <stop offset="100%" stop-color="#FFB4CE"/>
    </linearGradient>
    <linearGradient id="loveSoft" gradientUnits="userSpaceOnUse" x1="90" y1="132" x2="90" y2="48">
      <stop offset="0%" stop-color="#FF2D78"/>
      <stop offset="100%" stop-color="#FFB4CE"/>
    </linearGradient>
  </defs>

  <style>
    .fg      { fill: #171717; }
    .fg-mute { fill: #525252; }
    @media (prefers-color-scheme: dark) {
      .fg      { fill: #F5F5F5; }
      .fg-mute { fill: #A3A3A3; }
    }
    .wordmark { font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>

  <!-- shield -->
  <path d="M90 30 L140 49 V97 C140 126 117 145 90 154 C63 145 40 126 40 97 V49 Z"
        fill="none" stroke="url(#love)" stroke-width="6" stroke-linejoin="round"/>

  <!-- paw print: shelter dog sponsorship -->
  <ellipse cx="90" cy="100" rx="16" ry="13" fill="url(#loveSoft)"/>
  <circle cx="66" cy="82" r="6.5" fill="url(#loveSoft)"/>
  <circle cx="80" cy="68" r="7.5" fill="url(#loveSoft)"/>
  <circle cx="100" cy="68" r="7.5" fill="url(#loveSoft)"/>
  <circle cx="114" cy="82" r="6.5" fill="url(#loveSoft)"/>

  <!-- wordmark -->
  <text class="wordmark fg" x="186" y="88" font-size="48" font-weight="700" letter-spacing="1">HEY<tspan fill="url(#love)">LOLA</tspan></text>
  <text class="wordmark fg-mute" x="188" y="118" font-size="15" font-weight="500" letter-spacing="4.5">WEB3 DONATION LAYER</text>
  <rect x="188" y="130" width="300" height="2" rx="1" fill="url(#love)"/>
  <text class="wordmark fg-mute" x="188" y="152" font-size="12" font-weight="400" letter-spacing="1.5">CRYPTO-NATIVE SPONSORSHIP FOR SHELTER DOGS</text>
</svg>
